name: circl
description: "A Smart Community Platform for Resource Sharing and Microservices"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^2.0.1
  supabase_flutter: ^2.8.1
  image_picker: ^1.0.4
  geolocator: ^14.0.3
  google_maps_flutter: ^2.11.0
  geocoding: ^3.0.0 
  crypto: ^3.0.3
  flutter_secure_storage: ^10.3.1
  google_mlkit_text_recognition: ^0.15.1
  intl: ^0.20.2
  url_launcher: ^6.3.1  
  share_plus: ^13.2.0   
  cached_network_image: ^3.3.0
  payhere_mobilesdk_flutter: ^3.2.3
  google_fonts: ^8.1.0
  permission_handler: ^12.0.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  local_auth: ^3.0.1
  cunning_document_scanner: ^2.5.0
  file_picker: ^12.0.0-beta.7
  package_info_plus: ^10.2.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/google_logo.png

  fonts:
    - family: Ogelo-DEMO
      fonts:
        - asset: assets/fonts/Ogelo-DEMO.otf

    - family: SNPro
      fonts:
        - asset: assets/fonts/SNPro-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21 # Optional, but recommended